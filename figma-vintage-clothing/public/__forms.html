<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form Detection</title>
  </head>
  <body>
    <!-- Static form for Netlify build-time detection (SPA workaround) -->
    <form name="consignment" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consignment" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="brand" />
      <input type="text" name="size" />
      <input type="text" name="era" />
      <input type="text" name="asking" />
      <input type="text" name="condition" />
      <textarea name="description"></textarea>
      <input type="file" name="photos" multiple />
    </form>
  </body>
</html>


  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Vintage Clothing Website</title>
      <meta name="description" content="Discover and shop vintage clothing with a user-friendly interface featuring a personalized closet, new arrivals, and a consignment option, all backed by a 100% authenticity guarantee." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <!-- Netlify Forms detection (required for SPA submissions) -->
      <form name="consignment" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="brand" />
        <input type="text" name="size" />
        <input type="text" name="era" />
        <input type="text" name="asking" />
        <input type="text" name="condition" />
        <textarea name="description"></textarea>
        <input type="file" name="photos" multiple />
      </form>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
